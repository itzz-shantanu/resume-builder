# Mongodb configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resumebuilder_v2}

# Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_SENDER_EMAIL}

# Application info
app.base.url=${APP_BASE_URL:http://localhost:8080}

# Cloudinary information
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_APISECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
management.health.mail.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.port=${PORT:8080}